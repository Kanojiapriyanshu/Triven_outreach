name: Follow-up Worker

on:
  schedule:
    # Runs every 30 minutes — adjust to your sending cadence
    - cron: '*/30 * * * *'
  workflow_dispatch: # also allow manual trigger

jobs:
  process-followups:
    name: Process Pending Follow-ups
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger follow-up worker
        run: |
          echo "Triggering follow-up processing at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/worker" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: ${{ secrets.WORKER_SECRET }}" \
            -d '{"action":"process_followups"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Parse and display results
          SENT=$(echo "$BODY" | grep -o '"sent":[0-9]*' | grep -o '[0-9]*')
          SKIPPED=$(echo "$BODY" | grep -o '"skipped":[0-9]*' | grep -o '[0-9]*')
          FAILED=$(echo "$BODY" | grep -o '"failed":[0-9]*' | grep -o '[0-9]*')
          echo "✅ Sent: $SENT | Skipped: $SKIPPED | Failed: $FAILED"
