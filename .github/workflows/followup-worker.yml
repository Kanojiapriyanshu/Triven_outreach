name: Outreach Worker

on:
  schedule:
    # BACKUP ONLY. GitHub runs "every 5 minutes" schedules only a few times a day, which is far
    # too slow for sending. The primary trigger is an external scheduler (cron-job.org or QStash)
    # calling /api/worker?action=tick|audience|finder every 5 minutes: see System Health in the app.
    # Every run: check Gmail for replies/bounces, then every free inbox sends one email.
    # Follow-ups only go out inside the send window set in Settings (default 9 PM–12 AM IST).
    - cron: '*/5 * * * *'
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: outreach-worker
  cancel-in-progress: false

jobs:
  tick:
    name: Check replies & send next emails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run worker tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "::error::Set the APP_URL and WORKER_SECRET repository secrets"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 90 -w "\n%{http_code}" \
            -X POST "${APP_URL%/}/api/worker" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -H "x-worker-source: github-actions" \
            -d '{"action":"tick"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Worker returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Run audience pipeline (YouTube → prospects)
        # Separate call so a slow website crawl never delays sending
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          RESPONSE=$(curl -sS --max-time 90 -w "\n%{http_code}" \
            -X POST "${APP_URL%/}/api/worker" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -H "x-worker-source: github-actions" \
            -d '{"action":"audience"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP $HTTP_CODE"
          echo "$RESPONSE" | head -n-1
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Audience pipeline returned HTTP $HTTP_CODE"
          fi

      - name: Run Lead Finder (business searches → websites → emails)
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          RESPONSE=$(curl -sS --max-time 90 -w "\n%{http_code}" \
            -X POST "${APP_URL%/}/api/worker" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -H "x-worker-source: github-actions" \
            -d '{"action":"finder"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP $HTTP_CODE"
          echo "$RESPONSE" | head -n-1
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Lead Finder returned HTTP $HTTP_CODE"
          fi
