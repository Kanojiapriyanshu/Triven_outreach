name: Outreach Worker

on:
  schedule:
    # Every 15 minutes: check Gmail for replies/bounces, then send what's due.
    # Follow-ups only go out inside the send window set in Settings (default 9 PM–12 AM IST).
    - cron: '*/15 * * * *'
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: outreach-worker
  cancel-in-progress: false

jobs:
  tick:
    name: Check replies & send due emails
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Run worker tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "::error::Set the APP_URL and WORKER_SECRET repository secrets"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 90 -w "\n%{http_code}" \
            -X POST "${APP_URL%/}/api/worker" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -d '{"action":"tick"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Worker returned HTTP $HTTP_CODE"
            exit 1
          fi
